name: Version Sync

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    # Skip the whole job if the commit message contains [skip-sync]
    if: "!contains(github.event.head_commit.message, '[skip-sync]')"

    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      has_commits: ${{ steps.matrix.outputs.has_commits }}

    steps:
      - name: Prepare commit matrix
        id: matrix
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          branches='["3","5"]'

          matrix=$(jq -cn \
            --argjson commits "$COMMITS" \
            --argjson branches "$branches" \
            '{
              include: [
                $commits[] as $c |
                $branches[] as $b |
                {
                  sha: $c.id,
                  message: ($c.message | split("\n")[0]),
                  branch: $b
                }
              ]
            }')

          echo "value=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_commits=$(jq -r 'length > 0' <<< "$COMMITS")" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    if: needs.prepare.outputs.has_commits == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      # Extract ONLY the changes introduced by this commit
      - name: Generate commit patch
        id: patch
        env:
          SHA: ${{ matrix.sha }}
        run: |
          git diff --binary "$SHA^" "$SHA" > /tmp/change.patch

          if [ -s /tmp/change.patch ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      # Apply changes without merging main
      - name: Apply commit changes
        if: steps.patch.outputs.has_changes == 'true'
        run: |
          git apply --3way /tmp/change.patch

      # Create a draft PR
      - name: Create Pull Request
        if: steps.patch.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          base: ${{ matrix.branch }}

          branch: sync/${{ matrix.sha }}-to-${{ matrix.branch }}

          draft: true

          title: "Version sync for commit ${{ matrix.message }} to ${{ matrix.branch }}"

          body: |
            Automatically generated version synchronization.

            Source branch: main
            Target branch: ${{ matrix.branch }}

            Commit: ${{ matrix.sha }}

            Only the changes introduced by this commit
            are included in this synchronization.